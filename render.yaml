services:
  - type: web
    name: fast-work-parser
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build && npm run build:frontend
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DB_PATH
        value: data/jobs.sqlite
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
